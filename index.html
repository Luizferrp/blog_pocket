<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicação Web - Interface Pública</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- Header & Navegação -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="#" class="brand-logo">Blog Pocket</a>
      <nav class="nav-links">
        <a href="#home" class="nav-link active">Início</a>
        <a href="#recursos" class="nav-link">Recursos</a>
        <button id="btn-action-primary" class="btn btn-primary">Começar agora</button>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container hero-content">
      <h1>Conectando todos os seus conteudos em um só lugar</h1>
      <p>Acesse conteúdos, faça busca em tempo real, gerencie a organizacao das informaçõe de forma eficiente.</p>
    </div>
  </section>

  <!-- Conteúdo Principal / Feed Dinâmico -->
  <main class="container main-content">
    <section class="controls-bar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar registros..." />
      </div>
    </section>

    <!-- Indicador de Carregamento -->
    <div id="loading-spinner" class="spinner-container hidden">
      <div class="spinner"></div>
      <p>Carregando dados...</p>
    </div>

    <!-- Mensagens de Erro/Alerta -->
    <div id="status-message" class="alert-box hidden"></div>

    <!-- Grid de Cards Renderizados Dinamicamente -->
    <section id="cards-grid" class="cards-grid">
      <!-- Inserido dinamicamente via JS -->
    </section>
  </main>

  <!-- Modal Detalhes/Formulário -->
  <div id="app-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modal-title">Detalhes do Item</h3>
        <button id="btn-close-modal" class="btn-icon">&times;</button>
      </header>
      <div id="modal-body" class="modal-body">
        <!-- Conteúdo do Modal -->
      </div>
      <footer class="modal-footer">
        <button id="btn-modal-cancel" class="btn btn-secondary">Fechar</button>
        <button id="btn-modal-confirm" class="btn btn-primary">Confirmar</button>
      </footer>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Blog Pocket. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="main.js"></script>
  <script type="module" src="src/articles_catalog.js"></script>
  <script type="module" src="src/compressor.js"></script>
  <script type="module" src="src/tree.js"></script>

</body>
</html>
